<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStore - Personal App Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #f093fb;
            --bg-dark: #0f0c29;
            --bg-light: #302b63;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --card-bg: #1a1a2e;
            --border: #16213e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 10px 20px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-box::placeholder {
            color: #666;
        }

        .navbar-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-color: var(--primary);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .app-card:hover::before {
            left: 100%;
        }

        .app-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.2);
        }

        .app-icon {
            font-size: 56px;
            margin-bottom: 15px;
            display: block;
        }

        .app-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .app-description {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            min-height: 42px;
        }

        .app-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .app-actions {
            display: flex;
            gap: 10px;
        }

        .btn-install {
            flex: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .btn-install:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-remove {
            background: transparent;
            border: 1px solid #d32f2f;
            color: #ff6b6b;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .btn-remove:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid var(--border);
        }

        .stat {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 20px;
                flex-wrap: wrap;
                height: auto;
            }

            .search-box {
                flex: 1;
                min-width: 200px;
            }

            .header h1 {
                font-size: 32px;
            }

            .apps-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .modal-content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🚀 ProStore</div>
        <input type="text" class="search-box" id="searchBox" placeholder="Zoeken naar apps...">
        <div class="navbar-actions">
            <button class="btn-add" onclick="openAddAppModal()">+ App Toevoegen</button>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Welkom bij ProStore</h1>
            <p>Je persoonlijke App Store - Voeg je eigen apps toe en beheer ze</p>
        </div>

        <div class="categories" id="categoriesContainer">
            <button class="category-btn active" onclick="filterCategory(this, 'Alle')">📱 Alle</button>
            <button class="category-btn" onclick="filterCategory(this, 'Productiviteit')">📝 Productiviteit</button>
            <button class="category-btn" onclick="filterCategory(this, 'Games')">🎮 Games</button>
            <button class="category-btn" onclick="filterCategory(this, 'Tools')">🛠️ Tools</button>
            <button class="category-btn" onclick="filterCategory(this, 'Design')">🎨 Design</button>
            <button class="category-btn" onclick="filterCategory(this, 'Media')">🎵 Media</button>
        </div>

        <div class="apps-grid" id="appsGrid"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalApps">0</div>
                <div class="stat-label">Apps Beschikbaar</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="installedApps">0</div>
                <div class="stat-label">Apps Geïnstalleerd</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="totalCategories">0</div>
                <div class="stat-label">Categorieën</div>
            </div>
        </div>
    </div>

    <div class="modal" id="addAppModal">
        <div class="modal-content">
            <div class="modal-header">➕ Nieuwe App Toevoegen</div>
            <div class="form-group">
                <label>App Naam *</label>
                <input type="text" id="appName" placeholder="Bijv: Mijn App">
            </div>
            <div class="form-group">
                <label>Beschrijving *</label>
                <textarea id="appDescription" placeholder="Beschrijf wat je app doet..."></textarea>
            </div>
            <div class="form-group">
                <label>Icon (emoji)</label>
                <input type="text" id="appIcon" placeholder="📱" maxlength="5">
            </div>
            <div class="form-group">
                <label>Categorie</label>
                <select id="appCategory">
                    <option>Productiviteit</option>
                    <option>Games</option>
                    <option>Tools</option>
                    <option>Design</option>
                    <option>Media</option>
                    <option>Educatie</option>
                    <option>Systeem</option>
                </select>
            </div>
            <div class="form-group">
                <label>Download Link (optioneel)</label>
                <input type="url" id="appLink" placeholder="https://example.com/app">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="addApp()">Toevoegen</button>
                <button class="btn btn-secondary" onclick="closeAddAppModal()">Annuleren</button>
            </div>
        </div>
    </div>

    <script>
        let apps = JSON.parse(localStorage.getItem('prostore_apps')) || [
            {
                id: 1,
                icon: '🎵',
                name: 'Music Pro',
                description: 'Professionele muziekspeler met playlist support',
                version: '2.1.0',
                category: 'Media',
                link: '#',
                installed: false
            },
            {
                id: 2,
                icon: '✏️',
                name: 'NotePad++',
                description: 'Geavanceerde teksteditor met syntax highlighting',
                version: '1.5.2',
                category: 'Productiviteit',
                link: '#',
                installed: false
            },
            {
                id: 3,
                icon: '🎮',
                name: 'Quick Game',
                description: 'Leuke browser-based game voor pauzes',
                version: '3.0.1',
                category: 'Games',
                link: '#',
                installed: false
            },
            {
                id: 4,
                icon: '🛠️',
                name: 'DevTools',
                description: 'Hulpmiddelen voor developers en coders',
                version: '1.2.0',
                category: 'Tools',
                link: '#',
                installed: false
            }
        ];

        let currentFilter = 'Alle';

        function renderApps() {
            const grid = document.getElementById('appsGrid');
            const filteredApps = currentFilter === 'Alle' 
                ? apps 
                : apps.filter(app => app.category === currentFilter);

            if (filteredApps.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                        <div style="font-size: 48px; margin-bottom: 15px;">📭</div>
                        <div style="color: var(--text-secondary); font-size: 16px;">
                            Geen apps in deze categorie
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredApps.map(app => `
                <div class="app-card">
                    <span class="app-icon">${app.icon}</span>
                    <div class="app-name">${app.name}</div>
                    <div class="app-description">${app.description}</div>
                    <div class="app-meta">
                        <span>${app.category}</span>
                        <span>v${app.version}</span>
                    </div>
                    <div class="app-actions">
                        <button class="btn-install" onclick="installApp(${app.id})">
                            ${app.installed ? '✓ Geïnstalleerd' : 'Installeren'}
                        </button>
                        <button class="btn-remove" onclick="removeApp(${app.id})">Verwijderen</button>
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        function filterCategory(btn, category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderApps();
        }

        function openAddAppModal() {
            document.getElementById('addAppModal').classList.add('active');
        }

        function closeAddAppModal() {
            document.getElementById('addAppModal').classList.remove('active');
        }

        function addApp() {
            const name = document.getElementById('appName').value.trim();
            const description = document.getElementById('appDescription').value.trim();
            const icon = document.getElementById('appIcon').value || '📱';
            const category = document.getElementById('appCategory').value;
            const link = document.getElementById('appLink').value || '#';

            if (!name || !description) {
                alert('❌ Vul in elk geval Naam en Beschrijving in!');
                return;
            }

            const newApp = {
                id: Math.max(...apps.map(a => a.id), 0) + 1,
                icon,
                name,
                description,
                version: '1.0.0',
                category,
                link,
                installed: false
            };

            apps.push(newApp);
            saveApps();
            
            document.getElementById('appName').value = '';
            document.getElementById('appDescription').value = '';
            document.getElementById('appIcon').value = '';
            document.getElementById('appCategory').value = 'Productiviteit';
            document.getElementById('appLink').value = '';
            
            closeAddAppModal();
            renderApps();
            alert(`✅ "${name}" is toegevoegd aan ProStore!`);
        }

        function installApp(id) {
            const app = apps.find(a => a.id === id);
            if (app) {
                app.installed = !app.installed;
                saveApps();
                renderApps();
                alert(app.installed 
                    ? `✅ "${app.name}" is geïnstalleerd!`
                    : `🗑️ "${app.name}" is verwijderd!`
                );
            }
        }

        function removeApp(id) {
            const app = apps.find(a => a.id === id);
            if (app && confirm(`Weet je zeker dat je "${app.name}" wilt verwijderen?`)) {
                apps = apps.filter(a => a.id !== id);
                saveApps();
                renderApps();
                alert(`🗑️ "${app.name}" is verwijderd!`);
            }
        }

        function saveApps() {
            localStorage.setItem('prostore_apps', JSON.stringify(apps));
        }

        function updateStats() {
            document.getElementById('totalApps').textContent = apps.length;
            document.getElementById('installedApps').textContent = apps.filter(a => a.installed).length;
            document.getElementById('totalCategories').textContent = new Set(apps.map(a => a.category)).size;
        }

        document.getElementById('searchBox').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const grid = document.getElementById('appsGrid');
            
            const filteredApps = apps.filter(app =>
                app.name.toLowerCase().includes(query) ||
                app.description.toLowerCase().includes(query)
            );

            if (filteredApps.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                        <div style="font-size: 48px; margin-bottom: 15px;">🔍</div>
                        <div style="color: var(--text-secondary); font-size: 16px;">
                            Geen apps gevonden voor "${query}"
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredApps.map(app => `
                <div class="app-card">
                    <span class="app-icon">${app.icon}</span>
                    <div class="app-name">${app.name}</div>
                    <div class="app-description">${app.description}</div>
                    <div class="app-meta">
                        <span>${app.category}</span>
                        <span>v${app.version}</span>
                    </div>
                    <div class="app-actions">
                        <button class="btn-install" onclick="installApp(${app.id})">
                            ${app.installed ? '✓ Geïnstalleerd' : 'Installeren'}
                        </button>
                        <button class="btn-remove" onclick="removeApp(${app.id})">Verwijderen</button>
                    </div>
                </div>
            `).join('');
        });

        document.getElementById('addAppModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddAppModal();
        });

        renderApps();
        updateStats();
    </script>
</body>
</html>
