<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStore - Premium App Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0071E3;
            --secondary: #555FFF;
            --accent: #FF5E3A;
            --bg-dark: #000000;
            --bg-light: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1A1;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.15);
        }

        html {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f1e 100%);
            background-attachment: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: transparent;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 113, 227, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(85, 95, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 100;
        }

        .sidebar-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 113, 227, 0.3);
        }

        .sidebar-logo:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(0, 113, 227, 0.5);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .nav-item {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .nav-item:hover {
            background: var(--glass-hover);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        /* Main Content */
        .main-container {
            margin-left: 80px;
            position: relative;
            z-index: 1;
        }

        /* Top Bar */
        .topbar {
            height: 60px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .search-container {
            flex: 1;
            max-width: 350px;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 15px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 113, 227, 0.2);
        }

        .topbar-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Content Area */
        .content {
            padding: 40px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .section-header {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* Apps Grid */
        .apps-section {
            margin-bottom: 50px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .app-item {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .app-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .app-item:hover {
            background: var(--glass-hover);
            border-color: rgba(0, 113, 227, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 113, 227, 0.2);
        }

        .app-item:hover::before {
            opacity: 1;
        }

        .app-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .app-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .app-category {
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .app-description {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 12px;
            min-height: 26px;
        }

        .app-rating {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .star {
            color: #FFD60A;
        }

        .app-size {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .btn-download {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 113, 227, 0.4);
        }

        /* Featured Section */
        .featured-carousel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .featured-item {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 16px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .featured-item::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .featured-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 113, 227, 0.4);
        }

        .featured-content {
            position: relative;
            z-index: 2;
        }

        .featured-category {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .featured-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .featured-description {
            font-size: 14px;
            opacity: 0.95;
            line-height: 1.5;
        }

        .featured-icon {
            font-size: 64px;
            position: absolute;
            right: 20px;
            bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 1024px) {
            .apps-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">🚀</div>
        <div class="sidebar-nav">
            <button class="nav-item active" onclick="showSection('today')">📅</button>
            <button class="nav-item" onclick="showSection('apps')">🎮</button>
            <button class="nav-item" onclick="showSection('collections')">🏆</button>
            <button class="nav-item" onclick="showSection('categories')">🏷️</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Zoeken naar apps...">
            </div>
            <div class="topbar-actions">
                <button class="btn-ghost">+ App Toevoegen</button>
                <button class="btn-ghost">👤 Account</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Today Section -->
            <div id="today-section">
                <div class="section-header">
                    <h1 class="section-title">Vandaag</h1>
                    <p class="section-subtitle">Ontdek de beste apps van vandaag</p>
                </div>

                <!-- Featured -->
                <div class="apps-section">
                    <h2 class="section-subtitle" style="margin-bottom: 20px; font-size: 16px; font-weight: 600;">✨ Uitgelicht</h2>
                    <div class="featured-carousel" id="featured"></div>
                </div>

                <!-- Recommended -->
                <div class="apps-section">
                    <h2 class="section-subtitle" style="margin-bottom: 20px; font-size: 16px; font-weight: 600;">🎯 Aanbevolen</h2>
                    <div class="apps-grid" id="recommended"></div>
                </div>
            </div>

            <!-- All Apps Section -->
            <div id="apps-section" style="display: none;">
                <div class="section-header">
                    <h1 class="section-title">Alle Apps</h1>
                    <p class="section-subtitle">Verken alle beschikbare apps</p>
                </div>
                <div class="apps-grid" id="allApps"></div>
            </div>
        </div>
    </div>

    <script>
        const apps = [
            {
                id: 1,
                name: "Figma",
                category: "Design",
                description: "Collaboratief design platform voor teams",
                icon: "🎨",
                rating: 4.9,
                size: "245 MB",
                featured: true
            },
            {
                id: 2,
                name: "Visual Studio Code",
                category: "Developer Tools",
                description: "Krachtige code editor voor developers",
                icon: "💻",
                rating: 4.8,
                size: "156 MB",
                featured: true
            },
            {
                id: 3,
                name: "Spotify",
                category: "Muziek",
                description: "Luister naar miljoenen nummers",
                icon: "🎵",
                rating: 4.7,
                size: "487 MB",
                featured: true
            },
            {
                id: 4,
                name: "Adobe Creative Suite",
                category: "Design",
                description: "Professionele design tools",
                icon: "🖌️",
                rating: 4.6,
                size: "2.4 GB"
            },
            {
                id: 5,
                name: "Final Cut Pro",
                category: "Video",
                description: "Professioneel video editing",
                icon: "🎬",
                rating: 4.8,
                size: "1.2 GB"
            },
            {
                id: 6,
                name: "Logic Pro",
                category: "Muziek",
                description: "Professionele DAW voor muziek",
                icon: "🎹",
                rating: 4.7,
                size: "892 MB"
            },
            {
                id: 7,
                name: "Notion",
                category: "Productiviteit",
                description: "All-in-one werkruimte",
                icon: "📝",
                rating: 4.6,
                size: "324 MB"
            },
            {
                id: 8,
                name: "Slack",
                category: "Communicatie",
                description: "Team communication platform",
                icon: "💬",
                rating: 4.5,
                size: "267 MB"
            },
            {
                id: 9,
                name: "GitHub Desktop",
                category: "Developer Tools",
                description: "Git client voor developers",
                icon: "🐙",
                rating: 4.4,
                size: "182 MB"
            },
            {
                id: 10,
                name: "Sketch",
                category: "Design",
                description: "Digital design platform",
                icon: "✏️",
                rating: 4.7,
                size: "523 MB"
            },
            {
                id: 11,
                name: "Xcode",
                category: "Developer Tools",
                description: "IDE voor Apple development",
                icon: "🛠️",
                rating: 4.3,
                size: "12.4 GB"
            },
            {
                id: 12,
                name: "Zoom",
                category: "Communicatie",
                description: "Video conferencing platform",
                icon: "📹",
                rating: 4.2,
                size: "412 MB"
            }
        ];

        function renderStars(rating) {
            let stars = '';
            for (let i = 0; i < 5; i++) {
                stars += i < Math.floor(rating) ? '★' : '☆';
            }
            return stars;
        }

        function renderAppCard(app) {
            return `
                <div class="app-item" onclick="downloadApp('${app.name}')">
                    <div class="app-icon">${app.icon}</div>
                    <div class="app-category">${app.category}</div>
                    <div class="app-name">${app.name}</div>
                    <div class="app-description">${app.description}</div>
                    <div class="app-rating"><span class="star">${renderStars(app.rating)}</span> ${app.rating}</div>
                    <div class="app-size">${app.size}</div>
                    <button class="btn-download">↓ Krijgen</button>
                </div>
            `;
        }

        function renderFeaturedItem(app) {
            return `
                <div class="featured-item" onclick="downloadApp('${app.name}')">
                    <div class="featured-content">
                        <div class="featured-category">${app.category}</div>
                        <div class="featured-title">${app.name}</div>
                        <div class="featured-description">${app.description}</div>
                    </div>
                    <div class="featured-icon">${app.icon}</div>
                </div>
            `;
        }

        function initializeApps() {
            const featured = apps.filter(a => a.featured);
            const recommended = apps.slice(0, 6);

            document.getElementById('featured').innerHTML = featured.map(renderFeaturedItem).join('');
            document.getElementById('recommended').innerHTML = recommended.map(renderAppCard).join('');
            document.getElementById('allApps').innerHTML = apps.map(renderAppCard).join('');
        }

        function downloadApp(name) {
            alert(`📥 ${name} wordt nu gedownload!`);
        }

        function showSection(section) {
            document.querySelectorAll('[id$="-section"]').forEach(el => {
                el.style.display = 'none';
            });
            document.getElementById(section + '-section').style.display = 'block';
            
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = apps.filter(app =>
                app.name.toLowerCase().includes(query) ||
                app.category.toLowerCase().includes(query)
            );
            document.getElementById('recommended').innerHTML = filtered.map(renderAppCard).join('');
        });

        initializeApps();
    </script>
</body>
</html>
